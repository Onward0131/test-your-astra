<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; connect-src 'none'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Astra作品预览</title>
  <style>html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden;background:#edf2f0}iframe{display:block}</style>
</head>
<body>
  <iframe id="artifact" sandbox="allow-scripts" referrerpolicy="no-referrer" title="隔离动画作品"></iframe>
  <script>
    'use strict';
    // Serve this document with CSP sandbox allow-scripts, never allow-same-origin.
    addEventListener('message', event => {
      if (event.source !== parent || event.origin !== new URL(document.URL).origin) return;
      if (event.data?.type !== 'model-probe:render' || typeof event.data.html !== 'string' || event.data.html.length > 8 * 1024 * 1024) return;
      document.getElementById('artifact').srcdoc = event.data.html;
    });
  </script>
</body>
</html>
